<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="eqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Earth core circle -->
  <circle cx="50" cy="50" r="28" fill="url(#eqlGrad)" />

  <!-- Equatorial orbital lens ring -->
  <ellipse cx="50" cy="50" rx="42" ry="18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" transform="rotate(-25 50 50)" />

  <!-- Focal lens aperture point -->
  <circle cx="78" cy="37" r="4" fill="#ffffff" />
</svg>
